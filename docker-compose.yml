services:
  mariadb:
    image: mariadb:11
    container_name: speed-inventory-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: speed_inventory_management
      MARIADB_USER: inventory_user
      MARIADB_PASSWORD: inventory_pass
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: speed-inventory-api
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      APP_ENV: development
      SERVER_PORT: 8080
      FRONTEND_ORIGIN: http://localhost:5173
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: speed_inventory_management
      DB_USER: inventory_user
      DB_PASSWORD: inventory_pass
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_S3_API_URL: ${R2_S3_API_URL:-}
      ATTACHMENT_MAX_UPLOAD_BYTES: ${ATTACHMENT_MAX_UPLOAD_BYTES:-26214400}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: speed-inventory-web
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"

  portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.portal.prod
      args:
        VITE_API_BASE_URL: /api
    container_name: speed-inventory-portal
    depends_on:
      - backend
    ports:
      - "5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/portal.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mariadb_data:
